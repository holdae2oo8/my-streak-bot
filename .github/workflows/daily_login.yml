name: Daily Login Automation

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:      # Allows manual triggers from GitHub Actions UI

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Crucial: Allows bot to commit logs.json & dashboard.png back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Execute Browser Login Script
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: python bot.py

      - name: Commit and Push Updated Logs & Screenshot
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs.json dashboard.png
          git diff --staged --quiet || (git commit -m "Automated 6-hour login sync" && git push)

name: Daily Login Automation

on:
  schedule:
    - cron: '0 6 * * *' # Automates daily execution at 06:00 UTC
  workflow_dispatch:      # Manual trigger button

permissions:
  contents: write # Essential for pushing log updates back to repository

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Bot
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py

      - name: Commit and Push Updated Logs & Screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add logs.json dashboard.png || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update logs and screenshot [skip ci]" && git push)

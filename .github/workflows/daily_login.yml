name: Daily Streak Keeper

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-streak:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 3. Install Playwright
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      # 4. Install Chromium and system dependencies
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      # 5. Run streak bot
      - name: Run Streak Bot
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py

      # 6. Commit updated logs and screenshots
      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs.json step_1.png step_2.png step_3.png dashboard.png

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(auto): update streak logs and captures [skip ci]"
            git push
          fi

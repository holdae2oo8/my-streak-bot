name: Daily Login Automation

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Login & Capture Script
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py

      - name: Commit and Push Updated Captures & Logs
        if: always() # Ensures logs and screenshots push even if bot.py fails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all generated PNG images and logs safely
          git add *.png logs.json
          
          # Commit only if there are staged changes
          git diff --staged --quiet || git commit -m "chore: update daily screenshots and logs [skip ci]"
          git push

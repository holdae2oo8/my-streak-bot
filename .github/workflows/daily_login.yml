name: Daily Login Automation

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants explicit permission for GitHub Actions to push commits

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so rebase works cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Login & Capture Script
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: python bot.py

      - name: Commit and Push Updated Captures & Logs
        if: always() # Ensures logs and screenshots push even if bot.py fails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes from remote to prevent push conflicts
          git pull origin main --rebase || true
          
          # Stage all generated captures and log files
          git add step_*.png dashboard.png logs.json
          
          # Commit and push only if there are actual changes
          git diff --staged --quiet || git commit -m "chore: update daily screenshots and logs [skip ci]"
          git push origin main

      - name: Upload Logs & Screenshots as Artifacts
        if: always() # Uploads output files regardless of script pass/fail
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-artifacts
          path: |
            *.png
            logs.json

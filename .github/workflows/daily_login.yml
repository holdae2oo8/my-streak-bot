name: Daily Streak Keeper

on:
  # Run automatically every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-streak
  cancel-in-progress: false

jobs:
  keep-streak:
    name: Keep Streak Alive
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECK OUT THE REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. SET UP PYTHON
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. INSTALL PLAYWRIGHT
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      # ---------------------------------------------------------
      # 4. INSTALL CHROMIUM
      # ---------------------------------------------------------
      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 5. RUN THE STREAK BOT
      # ---------------------------------------------------------
      - name: Run streak bot
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          python bot.py

      # ---------------------------------------------------------
      # 6. GENERATE DATA.JSON
      #
      # This guarantees that EVERY workflow run changes a file.
      # The run number and timestamp are written into data.json.
      # ---------------------------------------------------------
      - name: Generate website data
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          LOG_FILE = "logs.json"
          DATA_FILE = "data.json"

          # Read logs generated by bot.py
          if os.path.exists(LOG_FILE):
              try:
                  with open(LOG_FILE, "r", encoding="utf-8") as f:
                      logs = json.load(f)
              except Exception:
                  logs = {
                      "streak": 0,
                      "history": []
                  }
          else:
              logs = {
                  "streak": 0,
                  "history": []
              }

          history = logs.get("history", [])

          if not isinstance(history, list):
              history = []

          # Most recent bot result
          last_run = history[0] if history else None

          success_count = sum(
              1 for entry in history
              if entry.get("passed") is True
          )

          failure_count = sum(
              1 for entry in history
              if entry.get("passed") is False
          )

          total_runs = len(history)

          generated_at = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          data = {
              "project": "My Streak Bot",
              "version": "3.0",

              "generated_at": generated_at,

              "workflow": {
                  "name": os.environ.get("WORKFLOW_NAME"),
                  "run_id": os.environ.get("RUN_ID"),
                  "run_number": os.environ.get("RUN_NUMBER"),
                  "run_attempt": os.environ.get("RUN_ATTEMPT"),
                  "event": os.environ.get("EVENT_NAME"),
                  "commit": os.environ.get("COMMIT_SHA")
              },

              "streak": logs.get("streak", 0),

              "stats": {
                  "total_runs": total_runs,
                  "successful_runs": success_count,
                  "failed_runs": failure_count,
                  "success_rate": (
                      round((success_count / total_runs) * 100, 1)
                      if total_runs else 0
                  )
              },

              "last_run": last_run,

              "history": history
          }

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("data.json generated successfully.")
          print(f"Workflow run: {os.environ.get('RUN_NUMBER')}")
          print(f"Generated: {generated_at}")
          print(f"Streak: {data['streak']}")
          print(f"History entries: {total_runs}")
          PY

      # ---------------------------------------------------------
      # 7. FORCE A UNIQUE COMMIT ON EVERY WORKFLOW RUN
      # ---------------------------------------------------------
      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json logs.json step_1.png step_2.png step_3.png dashboard.png

          git commit -m "chore(auto): streak sync #${{ github.run_number }} [skip ci]"

          git push origin HEAD:main
